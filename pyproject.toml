[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = [
    "E501",     # line length is handled by the formatter
    "SIM108",   # ternaries are not always clearer than if/else here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]    # asserts are the point

[tool.pytest.ini_options]
# The codebase has no packaging metadata and imports absolutely from the repo root
# (`import config as cnfg`, `from analysis.helpers... import ...`), so put the root on sys.path.
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "realdata: needs the built pickles in cnfg.OUTPUT_PATH; skipped when absent",
]
